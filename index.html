<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Columba Notebook – Verificación de Identidad</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --color-primary: #1a73e8;
      --color-error: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .logo-img {
      width: 120px;
      margin-bottom: 20px;
    }

    #buttonDiv {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: 600;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <img src="https://drive.google.com/thumbnail?id=15hTMpm_5aNuU2QKTWZGdK2XKdtpEog4w" class="logo-img"
      alt="Columba Notebook">

    <h2>Verificación de Identidad v3</h2>

    <p>
      Para verificar el estado de tu cuenta inicia sesión con Google.
    </p>

    <div id="buttonDiv"></div>

    <div id="mensaje"></div>

  </div>

  <script type="module">

    import { Capacitor }
      from 'https://cdn.jsdelivr.net/npm/@capacitor/core@8.6.0/+esm';
    import { SocialLogin as SocialLoginESM }
      from 'https://cdn.jsdelivr.net/npm/@capgo/capacitor-social-login@8.7.11/+esm';

    const CLIENTE_WEB =
      "498552950849-4cj5lp97qrbqf63jc914ji96lq744m4t.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby4ov5QtHYZUiw3CCXqpyxD8tU3LAiBSuZeKmTDcnY_FpTX_k946XlkJgEGoJTNsdOMLg/exec";

    let socialLoginInicializado = false;

    function obtenerPluginSocialLogin() {
      return window.Capacitor?.Plugins?.SocialLogin || SocialLoginESM || null;
    }

    function mostrarAviso(texto, error = false) {
      const m = document.getElementById("mensaje");
      if (!m) return;
      m.style.color = error ? "#d32f2f" : "#1a73e8";
      m.textContent = texto;
    }

    function generarHuellaDigitalNativa() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.width,
        screen.height,
        screen.colorDepth
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }

      return "FP-" + Math.abs(hash).toString(36).toUpperCase();
    }

    function obtenerOGenerarDeviceId() {
      let id = localStorage.getItem("cn_device_id");
      if (!id) {
        id =
          "DEV-" +
          Math.random()
            .toString(36)
            .substring(2, 10)
            .toUpperCase();
        localStorage.setItem("cn_device_id", id);
      }
      return id;
    }

    function construirURLFinal(token) {
      const deviceId = obtenerOGenerarDeviceId();
      const huellaDigital = generarHuellaDigitalNativa();
      const devName = navigator.userAgent;

      return (
        URL_APPS_SCRIPT +
        "?token=" + encodeURIComponent(token) +
        "&deviceId=" + encodeURIComponent(deviceId) +
        "&devName=" + encodeURIComponent(devName) +
        "&huellaDigital=" + encodeURIComponent(huellaDigital)
      );
    }

    window.C = function (resp) {
      if (!resp?.credential) {
        mostrarAviso("No se recibió credencial", true);
        return;
      }

      mostrarAviso("Acceso correcto...");
      window.location.href = construirURLFinal(resp.credential);
    };

    function renderizarBotonWeb(clienteId = CLIENTE_WEB) {
      const buttonDiv = document.getElementById("buttonDiv");
      if (!buttonDiv) return false;

      if (window.google?.accounts?.id) {
        google.accounts.id.initialize({
          client_id: clienteId,
          callback: C
        });

        google.accounts.id.renderButton(
          buttonDiv,
          {
            theme: "outline",
            size: "large",
            width: 290
          }
        );
        return true;
      }

      return false;
    }

    async function inicializarPluginNativo() {
      if (socialLoginInicializado) return true;
      const pluginNativo = obtenerPluginSocialLogin();
      if (!pluginNativo?.initialize || !pluginNativo?.login) return false;

      await pluginNativo.initialize({
        google: {
          webClientId: CLIENTE_WEB
        }
      });
      socialLoginInicializado = true;
      return true;
    }

    globalThis.ejecutarLoginMovilNativo = async function () {
      try {
        mostrarAviso("Conectando con Google...");

        const pluginListo = await inicializarPluginNativo();
        const pluginNativo = obtenerPluginSocialLogin();

        if (!pluginListo || !pluginNativo?.login) {
          mostrarAviso("Sin plugin nativo; usando acceso web...");
          renderizarBotonWeb(CLIENTE_WEB);
          return;
        }

        const respuesta = await pluginNativo.login({
          provider: "google",
          options: {}
        });

        const datos = respuesta?.result || respuesta || {};

        const token =
          datos.idToken ||
          datos.accessToken ||
          datos?.authentication?.idToken ||
          datos?.authentication?.accessToken;

        if (!token) {
          mostrarAviso("Sin token nativo; usando acceso web...");
          renderizarBotonWeb(CLIENTE_WEB);
          return;
        }

        mostrarAviso("Validando credenciales...");
        window.location.href = construirURLFinal(token);

      } catch (error) {
        const detalle = error?.message || String(error);
        mostrarAviso("Nativo: " + detalle + " — mostrando acceso web...", true);
        renderizarBotonWeb(CLIENTE_WEB);
      }
    };

    async function inicializar() {
      const esNativo = Capacitor.isNativePlatform();

      if (esNativo) {
        try {
          await inicializarPluginNativo();
        } catch (e) {}

        const buttonDiv = document.getElementById("buttonDiv");
        buttonDiv.innerHTML = `
          <button
            id="btnGoogleLogin"
            style="
              width:290px;
              height:42px;
              border:none;
              border-radius:4px;
              background:#1a73e8;
              color:white;
              cursor:pointer;
              font-weight:600;">
            Iniciar sesión con Google
          </button>
        `;

        const btn = document.getElementById("btnGoogleLogin");
        if (btn) {
          btn.addEventListener("click", ejecutarLoginMovilNativo);
        }

        return;
      }

      if (!renderizarBotonWeb(CLIENTE_WEB)) {
        mostrarAviso("Google GIS no cargó", true);
      }
    }

    window.addEventListener("load", inicializar);

  </script>

</body>

</html>
