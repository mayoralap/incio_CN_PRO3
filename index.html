<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Columba Notebook – Verificación de Identidad v6.2</title>

  <style>
    :root {
      --color-primary: #1a73e8;
      --color-error: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .main-card {
      width: 100%;
      max-width: 440px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .08);
    }

    .logo-img {
      width: 120px;
      margin-bottom: 20px;
    }

    #buttonDiv {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #mensaje {
      margin-top: 15px;
      font-weight: 600;
      word-break: break-word;
    }

    #diagnosticoBridge {
      margin-top: 14px;
      padding: 10px;
      font-size: 12px;
      text-align: left;
      background: #f1f3f4;
      border-radius: 8px;
      color: #3c4043;
      word-break: break-word;
    }

    .btn-google {
      width: 290px;
      height: 42px;
      border: none;
      border-radius: 4px;
      background: var(--color-primary);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-google:hover {
      background: #1558b0;
    }

    .btn-google:disabled {
      background: #9aa0a6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="main-card">

    <img src="https://drive.google.com/thumbnail?id=15hTMpm_5aNuU2QKTWZGdK2XKdtpEog4w" class="logo-img"
      alt="Columba Notebook">

    <h2>Verificación de Identidad v6.2</h2>

    <p>
      Para verificar el estado de tu cuenta inicia sesión con Google.
    </p>

    <div id="buttonDiv"></div>

    <div id="mensaje"></div>

    <div id="diagnosticoBridge"></div>

  </div>

  <script>
    // Cliente Web: usado por GIS en navegador y como serverClientId (webClientId) en Android
    const CLIENTE_WEB =
      "498552950849-4cj5lp97qrbqf63jc914ji96lq744m4t.apps.googleusercontent.com";

    // Cliente Android (com.columbanotebook.pro + SHA-1): validado automáticamente por Google Play Services en el SDK nativo
    const CLIENTE_ANDROID =
      "839165918275-7k8cp04fnbo9id02i2s6ni5pqvvl5om3.apps.googleusercontent.com";

    const URL_APPS_SCRIPT =
      "https://script.google.com/macros/s/AKfycby4ov5QtHYZUiw3CCXqpyxD8tU3LAiBSuZeKmTDcnY_FpTX_k946XlkJgEGoJTNsdOMLg/exec";

    function mostrarAviso(texto, error = false) {
      const m = document.getElementById("mensaje");
      if (!m) return;
      m.style.color = error ? "#d32f2f" : "#1a73e8";
      m.textContent = texto;
    }

    function obtenerBridgeCapacitor() {
      return window.Capacitor || null;
    }

    function esPlataformaNativa() {
      const cap = obtenerBridgeCapacitor();
      if (cap && typeof cap.isNativePlatform === "function") {
        return Boolean(cap.isNativePlatform());
      }
      return Boolean(window.androidBridge) || navigator.userAgent.includes("ColumbaAppNative");
    }

    function obtenerPluginColumbaAuth() {
      const cap = obtenerBridgeCapacitor();
      if (!cap) return null;

      if (cap.Plugins && cap.Plugins.ColumbaAuth) {
        return cap.Plugins.ColumbaAuth;
      }

      if (typeof cap.registerPlugin === "function") {
        try {
          const pluginRegistrado = cap.registerPlugin("ColumbaAuth");
          if (pluginRegistrado) return pluginRegistrado;
        } catch (e) {
          // Si ya estaba registrado internamente, lo leemos de Plugins
        }
      }

      return (cap.Plugins && cap.Plugins.ColumbaAuth) || null;
    }

    function actualizarDiagnosticoBridge() {
      const box = document.getElementById("diagnosticoBridge");
      if (!box) return;

      const cap = obtenerBridgeCapacitor();
      const columbaAuth = obtenerPluginColumbaAuth();
      const plugins = Object.keys((cap && cap.Plugins) || {});
      const headers = Array.isArray(cap && cap.PluginHeaders)
        ? cap.PluginHeaders.map((h) => h.name)
        : [];

      const info = {
        platform: cap && typeof cap.getPlatform === "function" ? cap.getPlatform() : (esPlataformaNativa() ? "android" : "web"),
        isNative: esPlataformaNativa(),
        androidBridge: Boolean(window.androidBridge),
        columbaAuthActivo: Boolean(columbaAuth && typeof columbaAuth.loginGoogle === "function"),
        clienteWeb: CLIENTE_WEB.slice(0, 12) + "..." + CLIENTE_WEB.slice(-32),
        clienteAndroid: CLIENTE_ANDROID.slice(0, 12) + "..." + CLIENTE_ANDROID.slice(-32),
        plugins,
        headers
      };

      box.textContent = "Bridge: " + JSON.stringify(info);
    }

    function generarHuellaDigitalNativa() {
      const raw = [
        navigator.userAgent,
        navigator.language,
        screen.width,
        screen.height,
        screen.colorDepth
      ].join("|");

      let hash = 0;
      for (let i = 0; i < raw.length; i++) {
        hash = ((hash << 5) - hash) + raw.charCodeAt(i);
        hash |= 0;
      }

      return "FP-" + Math.abs(hash).toString(36).toUpperCase();
    }

    function obtenerOGenerarDeviceId() {
      let id = localStorage.getItem("cn_device_id");
      if (!id) {
        id =
          "DEV-" +
          Math.random()
            .toString(36)
            .substring(2, 10)
            .toUpperCase();
        localStorage.setItem("cn_device_id", id);
      }
      return id;
    }

    function construirURLFinal(token) {
      const deviceId = obtenerOGenerarDeviceId();
      const huellaDigital = generarHuellaDigitalNativa();
      const devName = navigator.userAgent;

      return (
        URL_APPS_SCRIPT +
        "?token=" + encodeURIComponent(token) +
        "&deviceId=" + encodeURIComponent(deviceId) +
        "&devName=" + encodeURIComponent(devName) +
        "&huellaDigital=" + encodeURIComponent(huellaDigital)
      );
    }

    function capturarTokenDeUrl() {
      const params = new URLSearchParams(window.location.search);
      const queryToken =
        params.get("token") ||
        params.get("id_token") ||
        params.get("credential");

      if (queryToken) return queryToken;

      if (window.location.hash && window.location.hash.length > 1) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const hashToken =
          hashParams.get("token") ||
          hashParams.get("id_token") ||
          hashParams.get("credential");

        if (hashToken) return hashToken;
      }

      return null;
    }

    // Flujo exclusivo para Android nativo usando ColumbaAuthPlugin (evita 403 en WebView)
    async function iniciarLoginNativoAndroid() {
      actualizarDiagnosticoBridge();

      const btn = document.getElementById("btnGoogleLogin");
      const columbaAuth = obtenerPluginColumbaAuth();

      if (!columbaAuth || typeof columbaAuth.loginGoogle !== "function") {
        mostrarAviso(
          "Plugin nativo ColumbaAuth no detectado en el puente de Android. Revisa los datos de Bridge abajo.",
          true
        );
        return;
      }

      try {
        if (btn) btn.disabled = true;
        mostrarAviso("Abriendo selector nativo de cuentas de Google...");

        const respuesta = await columbaAuth.loginGoogle({
          webClientId: CLIENTE_WEB,
          androidClientId: CLIENTE_ANDROID
        });

        const token = respuesta && respuesta.token;
        if (!token) {
          throw new Error("El plugin nativo no devolvió token");
        }

        mostrarAviso("Acceso correcto, redirigiendo...");
        window.location.href = construirURLFinal(token);
      } catch (error) {
        mostrarAviso(
          "Error en autenticación nativa: " + (error && error.message ? error.message : String(error)),
          true
        );
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    globalThis.ejecutarLoginMovilNativo = iniciarLoginNativoAndroid;

    // Callback exclusivo para Google Identity Services (GIS) en navegador Web
    window.C = function (resp) {
      if (!resp || !resp.credential) {
        mostrarAviso("No se recibió credencial de Google Web", true);
        return;
      }

      mostrarAviso("Acceso correcto, redirigiendo...");
      window.location.href = construirURLFinal(resp.credential);
    };

    async function cargarScriptGISWeb() {
      if (window.google && window.google.accounts && window.google.accounts.id) return true;

      return new Promise((resolve) => {
        const script = document.createElement("script");
        script.src = "https://accounts.google.com/gsi/client";
        script.async = true;
        script.defer = true;
        script.onload = () => resolve(Boolean(window.google && window.google.accounts && window.google.accounts.id));
        script.onerror = () => resolve(false);
        document.head.appendChild(script);
      });
    }

    function renderizarBotonNativoAndroid() {
      const buttonDiv = document.getElementById("buttonDiv");
      buttonDiv.innerHTML = `
        <button id="btnGoogleLogin" type="button" class="btn-google">
          Iniciar sesión con Google
        </button>
      `;

      const btn = document.getElementById("btnGoogleLogin");
      if (btn) {
        btn.addEventListener("click", iniciarLoginNativoAndroid);
      }
    }

    async function inicializar() {
      actualizarDiagnosticoBridge();

      const tokenRetorno = capturarTokenDeUrl();
      if (tokenRetorno) {
        mostrarAviso("Token recibido, redirigiendo...");
        window.location.href = construirURLFinal(tokenRetorno);
        return;
      }

      if (esPlataformaNativa()) {
        renderizarBotonNativoAndroid();
        // Reevaluación breve por si el puente nativo termina de inyectar cabeceras tras load
        setTimeout(actualizarDiagnosticoBridge, 300);
        return;
      }

      const gisListo = await cargarScriptGISWeb();
      if (gisListo && window.google && window.google.accounts && window.google.accounts.id) {
        google.accounts.id.initialize({
          client_id: CLIENTE_WEB,
          callback: window.C
        });

        google.accounts.id.renderButton(
          document.getElementById("buttonDiv"),
          {
            theme: "outline",
            size: "large",
            width: 290
          }
        );
      } else {
        mostrarAviso("No se pudo cargar Google Identity Services en el navegador.", true);
      }
    }

    window.addEventListener("load", inicializar);
  </script>

</body>

</html>
